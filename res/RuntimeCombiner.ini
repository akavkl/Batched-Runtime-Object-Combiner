; Runtime Combiner: combines static references into batched meshes at run time, a runtime replacement for the
; precombined meshes (precombines). Log: Documents\My Games\Fallout4\F4SE\RuntimeCombiner.log

[General]
bEnabled=1
; Switch the engine's precombines off at startup (bUseCombinedObjects), so every static loads its own 3D and is
; combined here. 0 keeps them as configured; then only references outside the precombines are combined.
bDisablePrecombines=1
; 0 = dry run: collect and bake, log the numbers, change nothing in the scene.
bApply=1
; Virtual-key code (decimal) of the on/off switch for A/B comparisons: 114 = F3. 0 = unbound.
iToggleHotkey=114
; HUD notice when the switch is used.
bNotify=1

[Combine]
; Combined mesh size (game units): one gathers meshes whose centres lie within half of this of its first mesh;
; meshes left alone get a second pass within twice this.
; Larger = fewer draws, coarser culling (and more shadow-cascade work: the sun files whatever its shadow may reach).
fChunkSize=1024.0
; Meshes with a bigger bound radius stay as they are.
fMaxShapeRadius=2048.0
; A combined mesh must replace at least this many meshes. Meshes in a smaller group are drawn by a copy of
; themselves (sharing their data) instead, so their reference can still be hidden whole.
iMinShapesPerChunk=2
; Frames without 3D changes in a cell before it is (re)combined.
iSettleFrames=45
; Main-thread time per frame for collecting cells (ms).
fGatherBudgetMs=2.0
; 1 = each combined mesh hangs under its own fade node with its originals' fade range: it fades in after a
; load and fades out at a distance where they would. 0 = straight in its container (no fade).
bChunkFadeNodes=1
; 1 = combined meshes keep their originals' mesh LOD: farther away they draw fewer triangles, as the originals and
; the precombines do (needs bChunkFadeNodes=1). 0 = full detail at every distance.
bChunkMeshLOD=1
; 1 = originals hidden whole wait under one hidden node per cell, which the culling never visits; 0 = they stay
; hidden in place, where every frame's culling steps over each one.
bParkHidden=1
; Meshes farther from the player are merged coarser: beyond this distance (game units) fChunkSize grows in
; proportion to the distance (twice the size at twice the distance, up to 8 times), so combined meshes keep about
; the same size on screen and far fewer stand far away, where the sun's far shadow cascade draws them. A cell is
; rebuilt when the player has moved enough to change its sizes by half. 0 = the same size everywhere.
fChunkGrowth=2048.0
; Keeps combined meshes dense: one may reach (from its first mesh, plus a mesh's radius) beyond a quarter of
; fChunkSize only up to this many times the radius of one sphere as big as all its meshes together. Small meshes
; scattered over a wide area then stay apart, so their wide shared bound doesn't cast a shadow the sun's cascades
; and CBRO must keep. 0 = no limit (the default: 3 left 2.6x as many single meshes and drew more, run 35).
fClusterSpread=0
; Combined meshes hang under group nodes, one per square of this size (game units) per parent node. Previs tests
; each group, CBRO scans each group every frame. 0 = one group per parent (as the precombines' one node per cell).
; -1 = auto: 0 with CBRO, 1024 without.
fGroupSize=-1
; 1 = every attached cell is combined before the loading screen closes, so the first frame draws combined meshes
; instead of every original one by one. 0 = combining starts after the loading screen, cell by cell.
bCombineDuringLoad=1
; The longest (ms) the loading screen is held for that. Cells not done by then finish after it closes.
iLoadWaitMs=5000

[Debug]
; One log line per combined cell.
bLogCells=1
; Combined references re-checked per frame (moved, disabled, unloaded or re-shown originals).
iWatchdogRefsPerFrame=512
; 1 = measurement probes for performance comparisons: GPU work and time per render stage (wraps four render calls
; and runs GPU queries every frame), the scene census and object sizes (a ~6 ms frame at a summary after the scene
; changed), the chunk audit and previs line, and a self-check of every combined cell. 0 = none of that work is done.
; The per-cell draw checks that show the originals when combined meshes aren't drawn are not probes and stay on.
bProbes=0
